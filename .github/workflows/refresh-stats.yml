
name: Refresh NFL statistics

on:
  schedule:
    - cron: '20 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nfl-stats-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download NFL statistics
        run: |
          python edgecheck-public/scripts/update_stats.py

      - name: Copy statistics to live website
        run: |
          mkdir -p "edgecheck-public 3/data"
          cp edgecheck-public/data/stats.json "edgecheck-public 3/data/stats.json"

      - name: Generate upcoming NFL game suggestions
        run: |
          python "edgecheck-public 3/scripts/generate_game_picks.py"

      - name: Save and publish statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add edgecheck-public/data/stats.json
          git add "edgecheck-public 3/data/stats.json"
          git add "edgecheck-public 3/data/game-picks.json"

          if ! git diff --cached --quiet; then
            git commit -m "Update NFL stats"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No statistics changes to publish."
          fi
